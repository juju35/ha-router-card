version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: "chore(deps)"
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    commit-message:
      prefix: "chore(deps)"
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    commit-message:
      prefix: "chore(deps)"
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
